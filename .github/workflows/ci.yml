name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  release-tools:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Release, migration and timing checks
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q tools
      - name: Shell syntax
        shell: bash
        run: for file in scripts/*.sh; do bash -n "$file" || exit; done
