# The release: built only when the owner asks for one, never on an ordinary push or a pull request.
#
#   git tag v0.1.0 && git push origin v0.1.0          (or Actions > Release > Run workflow, with the tag)
#
# On a version tag it makes the build kit from the pinned MSYS2 packages (tools/build_kit_packages.json), the release
# zip, its SHA-256 and the sources zip with tools/make_release.py, checks them without any game data, and creates a
# DRAFT GitHub release with CHANGELOG.md's section for the version as its body. Nothing is ever published by this
# workflow: the owner runs docs/RELEASE_CHECKLIST.md on a clean PC, then publishes the draft by hand.
#
# Every step is a thin call into tools/make_build_kit.py or tools/make_release.py, so the same commands run on a
# developer's PC (README, "Making a release").
#
# When the owner publishes a release, the notify job tells RecompWatcher (if the WATCHER_DISPATCH_TOKEN secret exists).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The version tag to release (already pushed), e.g. v0.1.0'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: write # the draft release and its files
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Version from the tag
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-pre)"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "WORK=$(cygpath -m "$RUNNER_TEMP")/tmb" >> "$GITHUB_ENV"

      - name: Check out the tag (and the PS2Recomp submodule at its recorded commit)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          submodules: true
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: The changelog has this version
        run: python tools/make_release.py --check-changelog --version "$VERSION"

      - name: MSYS2 (pacman, and sh for FFmpeg's configure; the toolchain itself comes from the pins)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: diffutils

      - name: Cache the downloads (pinned MSYS2 packages, FFmpeg, Python, MSYS2 sources, the font)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmb/downloads
          key: tmb-downloads-${{ hashFiles('tools/build_kit_packages.json', 'tools/make_build_kit.py') }}
          restore-keys: tmb-downloads-

      - name: Cache the kit's FFmpeg (by the pins and make_build_kit.py)
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tmb/kit/ffmpeg
            ${{ runner.temp }}/tmb/kit/sources
            ${{ runner.temp }}/tmb/kit/licenses/ffmpeg
            ${{ runner.temp }}/tmb/kit/.parts/ffmpeg.json
          key: tmb-ffmpeg-${{ hashFiles('tools/build_kit_packages.json', 'tools/make_build_kit.py') }}

      - name: Install the pinned MSYS2 packages (exact files, SHA-256 checked)
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: python tools/make_build_kit.py --install-packages --msys "$MSYS2_ROOT" --downloads "$WORK/downloads"

      - name: Build kit
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          FFMPEG_CACHED: ${{ steps.ffmpeg.outputs.cache-hit }}
        run: |
          set -eu
          steps="--only toolchain --only python --only deps"
          if [ "$FFMPEG_CACHED" != true ]; then steps="$steps --only ffmpeg"; fi
          python tools/make_build_kit.py --out "$WORK/kit" --msys "$MSYS2_ROOT" --downloads "$WORK/downloads" \
            --work "$WORK/kit-work" $steps --only tools --only manifest

      - name: Make the release (zip, .sha256, sources zip, notes from CHANGELOG.md)
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python tools/make_release.py --version "$VERSION" --kit "$WORK/kit" --msys "$MSYS2_ROOT" \
            --out "$WORK/release" --downloads "$WORK/downloads" --with-sources

      - name: Smoke checks (no game data anywhere)
        run: |
          set -eu
          rel="$WORK/release"
          name="TMB_Recomp-$VERSION"
          # The zip: no game file, the files a release needs; the hashes.
          python tools/make_release.py --verify-zip "$rel/$name.zip"
          (cd "$rel" && sha256sum -c "$name.zip.sha256" && sha256sum -c "$name-sources.zip.sha256")
          # Unzipped as a player would.
          t="$WORK/smoke"
          rm -rf "$t" && mkdir -p "$t/user"
          python -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$rel/$name.zip" "$t"
          app="$t/TMB_Recomp"
          head -c 1048576 /dev/zero > "$t/not_a_disc.iso"
          # tmb_build with the kit's own Python refuses a file that is not a disc.
          if "$app/kit/python/python.exe" -I -X utf8 "$app/source/tools/tmb_build.py" --check \
              --disc "$t/not_a_disc.iso" > "$t/check.txt" 2>&1; then
            cat "$t/check.txt"; echo "::error::tmb_build --check accepted a file of zeros"; exit 1
          fi
          cat "$t/check.txt"
          grep -q "is not an ISO9660 disc image" "$t/check.txt"
          # The launcher, without a window: its version, the release folder, the changelog, the same disc check.
          "$app/TMB Launcher.exe" --version
          if ! PS2X_USER_DIR="$t/user" "$app/TMB Launcher.exe" --self-check "$t/not_a_disc.iso" \
              --report "$t/self-check.txt"; then
            cat "$t/self-check.txt"; echo "::error::the launcher's self-check failed"; exit 1
          fi
          cat "$t/self-check.txt"
          grep -q "^version $VERSION$" "$t/self-check.txt"

      - name: Draft GitHub release (never published here)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/make_release.py --version "$VERSION" --out "$WORK/release" --publish-only

      - name: Summary
        if: always()
        run: |
          {
            echo "## TMB_Recomp $VERSION"
            echo
            if [ -f "$WORK/release/RELEASE_NOTES.md" ]; then
              echo "A **draft** release was created if every step passed: run docs/RELEASE_CHECKLIST.md on a clean PC, then publish it."
              echo
              cat "$WORK/release/RELEASE_NOTES.md"
            else
              echo "No release was made (see the failed step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    # The owner published a release: RecompWatcher refreshes its page now instead of at its daily run.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      WATCHER_TOKEN: ${{ secrets.WATCHER_DISPATCH_TOKEN }}
    steps:
      - name: Tell RecompWatcher (skipped without the WATCHER_DISPATCH_TOKEN secret)
        if: env.WATCHER_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WATCHER_TOKEN }}
        run: gh api repos/boubou666/RecompWatcher/dispatches -f event_type=project-updated
